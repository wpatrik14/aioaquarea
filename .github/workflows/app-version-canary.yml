name: App version canary

# Daily, credential-free check that Panasonic's login gate still accepts an app
# version the library can send (see "App version canary" in the README). Opens
# an issue when it does not. Needs no secrets: only the default GITHUB_TOKEN.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-version-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: panasonic-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the library
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Probe the gate
        id: probe
        run: |
          set +e
          python scripts/check_app_version_gate.py --report "$RUNNER_TEMP/report.md" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = accepted; 1/2 = rejected / unexpected answer (issue below);
          # 3 = gate unreachable, probably transient: fail the job, no issue
          if [ "$code" -eq 3 ]; then exit 3; fi
          exit 0
      - name: Open an issue (once)
        if: steps.probe.outputs.exit_code == '1' || steps.probe.outputs.exit_code == '2'
        run: |
          gh label create "$LABEL" --color B60205 \
            --description "Panasonic login gate rejects the app version" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "An open $LABEL issue exists already, not opening another one."
          else
            gh issue create --label "$LABEL" \
              --title "Panasonic gate rejects app version" \
              --body-file "$RUNNER_TEMP/report.md"
          fi
          # the check itself failed, so the run should not look green
          exit 1
