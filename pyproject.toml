# https://packaging.python.org/tutorials/packaging-projects/

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "aioaquarea-ng"
version = "1.3.0"
authors = [
  { name="Carlos J. Aliaga", email="dev@cjaliaga.net" },
]
maintainers = [
  { name="wpatrik14" },
]
description = "Asynchronous library to control Panasonic Aquarea devices"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "aiohttp>=3.9",
  "beautifulsoup4",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "aioresponses",
  "aiohttp<3.14",  # aioresponses 0.7.9 does not support aiohttp 3.14 yet
]
lint = ["ruff"]

[project.urls]
"Homepage" = "https://github.com/wpatrik14/aioaquarea"
"Bug Tracker" = "https://github.com/wpatrik14/aioaquarea/issues"

[tool.setuptools]
packages = ["aioaquarea"]

[tool.setuptools.package-data]
aioaquarea = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["aioaquarea"]

[tool.coverage.report]
fail_under = 80
show_missing = true
